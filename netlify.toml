# Build Netlify relié à la branche main.
# Prénom, message, BPM et départ de la chanson viennent des variables d'environnement
# du site (VITE_LOVE_NAME, VITE_LOVE_MESSAGE, VITE_SONG_BPM, VITE_SONG_START_SEC).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
